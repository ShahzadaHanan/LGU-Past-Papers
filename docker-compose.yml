services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: lgu_app_v2
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    networks:
      - lgu-network

  mysql:
    image: mysql:8.4
    container_name: lgu_mysql_v2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${DB_DATABASE:?set DB_DATABASE in .env}
      MYSQL_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    networks:
      - lgu-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: lgu_phpmyadmin_v2
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    depends_on:
      - mysql
    ports:
      - "8081:80"
    networks:
      - lgu-network

volumes:
  mysql_data:

networks:
  lgu-network:
